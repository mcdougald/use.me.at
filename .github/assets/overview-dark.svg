<svg xmlns="http://www.w3.org/2000/svg" width="880" height="281" viewBox="0 0 880 281" role="img" aria-label="use.me.at at a glance: Sectioned and counted, Current and retired, Machine-readable too, Links that stay alive">
<rect x="0.5" y="0.5" width="879" height="280" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#404040" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">Sectioned and</tspan><tspan x="44" dy="22">counted</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">Laptop, accessories,</tspan><tspan x="44" dy="21">PC build, homelab,</tspan><tspan x="44" dy="21">coding and software,</tspan><tspan x="44" dy="21">with an index of</tspan><tspan x="44" dy="21">counts per section.</tspan></text>
<rect x="236" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">Current and</tspan><tspan x="256" dy="22">retired</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Every item is marked</tspan><tspan x="256" dy="21">in use or retired, so</tspan><tspan x="256" dy="21">past gear stays</tspan><tspan x="256" dy="21">documented without</tspan><tspan x="256" dy="21">crowding the list.</tspan></text>
<rect x="448" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#404040" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">Machine-readable</tspan><tspan x="468" dy="22">too</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">/uses.json projects</tspan><tspan x="468" dy="21">the page as data,</tspan><tspan x="468" dy="21">optionally with my</tspan><tspan x="468" dy="21">coding activity from</tspan><tspan x="468" dy="21">WakaTime.</tspan></text>
<rect x="660" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#404040" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="680" dy="0">Links that stay</tspan><tspan x="680" dy="22">alive</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">A scheduled job</tspan><tspan x="680" dy="21">probes every external</tspan><tspan x="680" dy="21">link each quarter, so</tspan><tspan x="680" dy="21">dead product pages</tspan><tspan x="680" dy="21">get noticed.</tspan></text>
